services:
    _defaults:
        autowire: true
        autoconfigure: true

    # The active registry implementation (DoctrineRegistry or RedisRegistry) and
    # the RegistryInterface alias are registered programmatically by
    # RegistryExtension, based on the configured `engine`. This avoids any hard
    # reference to a redis client service (and to snc/redis-bundle) when the
    # default Doctrine engine is used.
    #
    # Built-in CRUD controllers/forms are wired separately and only when
    # `registry.ui.enabled` is true (see P5).
